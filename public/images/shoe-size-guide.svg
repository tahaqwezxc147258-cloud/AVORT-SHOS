<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><rect width="900" height="620" fill="#fff"/><text x="450" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#b91c1c">راهنمای انتخاب سایز کفش</text><text x="450" y="88" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">پا را روی کاغذ بگذارید و طول پا را از پاشنه تا بلندترین انگشت اندازه بگیرید</text><line x1="60" y1="130" x2="840" y2="130" stroke="#0f172a" stroke-width="3"/><text x="250" y="165" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">طول کف پا (سانتی‌متر)</text><text x="650" y="165" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">سایز کفش</text><g font-family="Arial" font-size="20" fill="#1e293b"><text x="250" y="210" text-anchor="middle">۲۲.۹ تا ۲۳.۱</text><text x="650" y="210" text-anchor="middle">۳۶</text><text x="250" y="255" text-anchor="middle">۲۳.۲ تا ۲۳.۵</text><text x="650" y="255" text-anchor="middle">۳۷</text><text x="250" y="300" text-anchor="middle">۲۳.۶ تا ۲۴.۱</text><text x="650" y="300" text-anchor="middle">۳۸</text><text x="250" y="345" text-anchor="middle">۲۴.۲ تا ۲۴.۸</text><text x="650" y="345" text-anchor="middle">۳۹</text><text x="250" y="390" text-anchor="middle">۲۴.۹ تا ۲۵.۱</text><text x="650" y="390" text-anchor="middle">۴۰</text><text x="250" y="435" text-anchor="middle">۲۵.۲ تا ۲۵.۷</text><text x="650" y="435" text-anchor="middle">۴۱</text><text x="250" y="480" text-anchor="middle">۲۵.۸ تا ۲۶.۷</text><text x="650" y="480" text-anchor="middle">۴۲ تا ۴۴</text><text x="250" y="525" text-anchor="middle">۲۶.۸ تا ۲۷.۹</text><text x="650" y="525" text-anchor="middle">۴۵ تا ۴۶</text></g><path d="M90 570h300" stroke="#e11d48" stroke-width="5" marker-end="url(#a)"/><text x="450" y="580" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">هر دو پا را اندازه بگیرید و عدد بزرگ‌تر را ملاک قرار دهید</text></svg>
